[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0",  }
tokio.workspace = true
proto.workspace = true
serde.workspace = true
garde.workspace = true
dotenvy = "0.15.7"
axum = { version = "0.8.9", features = ["macros", "ws"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "schema-sync",
    "entity-registry",
    "macros",
    "runtime-tokio",
] }
rand = "0.10.3"
sha2 = "0.11.0"
base64 = "0.23.1"
hex = "0.4"
